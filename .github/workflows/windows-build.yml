name: Windows release build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable Windows EXE
        shell: pwsh
        run: |
          ./scripts/BUILD-RELEASE.ps1
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/portable/nanoSONAR.exe)) { throw 'Missing EXE' }
          if (-not (Test-Path dist/releases/nanoSONAR-v1.2-win-x64.zip)) { throw 'Missing ZIP' }
          Get-FileHash dist/releases/nanoSONAR-v1.2-win-x64.zip -Algorithm SHA256
      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoSONAR-v1.2-win-x64-unsigned
          path: dist/releases/nanoSONAR-v1.2-win-x64.zip
          if-no-files-found: error
