name: Windows release build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable Windows EXE
        shell: pwsh
        run: |
          ./scripts/BUILD-RELEASE.ps1
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/portable/nanoSONAR.exe)) { throw 'Missing EXE' }
          if (-not (Test-Path dist/releases/nanoSONAR-v1.2-win-x64.zip)) { throw 'Missing ZIP' }
          Get-FileHash dist/releases/nanoSONAR-v1.2-win-x64.zip -Algorithm SHA256
      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoSONAR-v1.2-win-x64-unsigned
          path: dist/releases/nanoSONAR-v1.2-win-x64.zip
          if-no-files-found: error

      - name: Publish v1.2.0 GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.2.0'
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          gh release create $tag dist/releases/nanoSONAR-v1.2-win-x64.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "nanoSONAR v1.2.0" --notes "Windows x64 portable release. Includes Sonar live feedback and current v1.2 improvements. This executable is not yet code-signed. Code signing policy: https://github.com/mikeauftour/nanoSONAR/blob/main/CODE_SIGNING_POLICY.md. Free code signing provided by SignPath.io, certificate by SignPath Foundation, subject to acceptance."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
